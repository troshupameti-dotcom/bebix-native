name: CI

# Kontroll automatik pas çdo ndryshimi: llojet (TypeScript), rregullat (lint) dhe
# testet. Një gabim i vogël kapet këtu, para se të arrijë te klientët.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --ext .ts,.tsx
      - run: npx jest --ci
