name: CI

# Kontroll automatik pas çdo ndryshimi: llojet (TypeScript), rregullat (lint) dhe
# testet. Një gabim i vogël kapet këtu, para se të arrijë te klientët.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --ext .ts,.tsx
      - run: npx jest --ci
      # E njëjta gjë në orën 02:00: modaliteti i natës ndizet vetë 22:00–06:00, dhe një test që varej nga ora
      # kaloi këtu (ditën) por rrëzoi build-in EAS në 00:02. Zona kohore zgjidhet që ora lokale të jetë 02:xx.
      - name: Testet natën (ora lokale 02:xx)
        run: |
          H=$(date -u +%H); OFF=$(( (2 - 10#$H + 24) % 24 )); [ $OFF -gt 12 ] && OFF=$((OFF-24))
          if [ $OFF -ge 0 ]; then Z="Etc/GMT-$OFF"; else Z="Etc/GMT+$((-OFF))"; fi
          echo "TZ=$Z, ora lokale: $(TZ=$Z date +%H:%M)"
          TZ=$Z npx jest --ci --silent

  # Testet e bazës (RLS, funksionet) dhe të pagesave, në Postgres lokal (PGlite). Migrimet ekzekutohen në
  # prodhim me dorë: këtu provohen para se të arrijnë atje. PGlite s'është varësi e projektit, vetëm e këtij hapi.
  sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save @electric-sql/pglite
      - name: Testet SQL dhe të pagesave
        run: |
          status=0
          for f in supabase/tests/*.test.mjs; do
            echo "::group::$f"
            if ! node "$f"; then echo "::error file=$f::$f dështoi"; status=1; fi
            echo "::endgroup::"
          done
          exit $status
